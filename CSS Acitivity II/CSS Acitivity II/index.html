<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Box Model</title>
  <style>
    body {
      margin: 0;
    }

    
    .box1 {
      width: 200px;
      height: 200px;
      padding: 20px;
      border: 10px solid black;
      background-color: cadetblue;
    }

    
    .box2 {
      width: 200px;
      height: 200px;
      border-style: solid;
      border-color: black;
      border-width: 20px 10px;
      background-color: #ffd43f;
      margin-left: 260px;  
    }

    
    .box3 {
      width: 200px;
      height: 200px;
      border: 10px solid black;
      background-color: indianred;
      margin-left: 40px;    
    }
  </style>
</head>
<body>

  <div class="box1">
    Lorem ipsum dolor sit amet, consectetur adipiscing elit. Aliquam at sapien
    porttitor urna elementum lacinia. In id magna pulvinar, ultricies lorem id,
    vehicula elit. Aliquam eu luctus nisl, vitae pellentesque magna. Phasellus
    dolor metus, laoreet ac convallis sit amet, efficitur sed dolor.
  </div>

  <div class="box2"></div>

  <div class="box3"></div>

</body>
</html>
